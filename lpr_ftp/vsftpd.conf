# /etc/vsftpd.conf: receives the LPR cameras' FTP uploads (plate crops, scene photos,
# hourly summaries). Installed by lpr_ftp/setup.sh; edit the copy in the repo.
#
# Only the upload account (vsftpd.userlist) can log in, only from the camera addresses
# (TCP wrappers: /etc/hosts.allow), and it can only upload into its own folder.

listen=YES
listen_ipv6=NO
listen_port=2121

anonymous_enable=NO
local_enable=YES
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
pam_service_name=vsftpd_lpr
tcp_wrappers=YES

# Upload only, locked into the account's home (the drop folder)
write_enable=YES
download_enable=NO
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/run/vsftpd/empty

# Group www-data (vehicle_service) can read and delete the uploads
local_umask=002
file_open_mode=0664

# The cameras have no passive-mode setting, so allow both modes
pasv_enable=YES
pasv_min_port=2122
pasv_max_port=2131
connect_from_port_20=NO

max_per_ip=4
idle_session_timeout=600
use_localtime=YES
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
ssl_enable=NO
